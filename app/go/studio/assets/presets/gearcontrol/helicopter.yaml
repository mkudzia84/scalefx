# /gearcontrol.yaml — Gear definitions for the hub's GearControlService.
#
# Upload to the HUB's LittleFS as /gearcontrol.yaml.  Each gear is one
# H-bridge motor (BiDcMotor role) addressed by PortRef.
#
# PREFERRED: address the board by ALIAS — `board: gear1` resolves to the
# expander's GUID via the `expanders:` block in /hubfx.yaml (where the
# board is declared once).  Swap a physical board = edit one line there,
# not every effect file.  The raw `guid: "AB12"` form still works as a
# fallback (e.g. when /hubfx.yaml has no matching alias).
#
# Status LEDs are NOT configured here — the GearControl expander lights
# its own small per-motor direction LEDs locally from the H-bridge state
# (CW = forward/deploy, CCW = reverse/retract; both blink on a hard
# over-current fault).
#
# `/hubfx.yaml`'s `features.gears:` flag is the master kill-switch.
#
# Motor idx maps to the expander's H-bridge ports:
#   hbridge idx 0/1/2 → motors on GP15/16, 17/18, 19/20
#
# Voltage-first drive (2.44.0): each strut declares its motor DRIVE
# voltage (motor_voltage_mv) — the firmware seeks at full scale and the
# BiDcMotor role's cap delivers exactly that average at the motor on ANY
# pack (live per-motor INA226 rail, battery-sag compensated).  `reverse`
# flips the deploy direction.  The old raw deploy_duty / retract_duty
# keys are RETIRED and ignored.  timeout_ms is the full-travel watchdog —
# the motor runs until the INA226 reports a stall (mechanical endpoint)
# or this elapses (→ ERROR).

schema_version: 1
enabled: true

gears:
  - id: 0
    name: nose
    motor: { board: gear1, kind: hbridge, idx: 0 }
    reverse: false
    timeout_ms: 4000
    motor_voltage_mv: 6000

  - id: 1
    name: left_main
    motor: { board: gear1, kind: hbridge, idx: 1 }
    reverse: false
    timeout_ms: 4000
    motor_voltage_mv: 6000

  - id: 2
    name: right_main
    motor: { board: gear1, kind: hbridge, idx: 2 }
    reverse: false
    timeout_ms: 4000
    motor_voltage_mv: 6000
