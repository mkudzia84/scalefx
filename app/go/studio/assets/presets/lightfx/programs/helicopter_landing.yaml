# Helicopter — Landing (approach, light deployed)
#
# Same FAA-realistic anti-collision pattern as "Helicopter — Flight"
# (steady position/tail; red beacon flash + white strobe double-flash at
# ~50 fpm, 1200 ms shared period) PLUS the landing light deployed and on.
#
# The landing light is a LandingLightService entity (servo + bulb), NOT a
# raw LightFx track — activating this program flips landing-light ID 0 ON
# via `landing_bindings:` (servo deploys, then the bulb lights).

schema_version: 2

tracks:
  # ── Red anti-collision beacon — rotating-style flash, ~50/min ──
  - channel: "Red beacon"
    loop: true
    events:
      - { kind: fade_in,  brightness_pct: 100, duration_ms: 200 }
      - { kind: fade_out, brightness_pct: 100, duration_ms: 200 }
      - { kind: "off",                          duration_ms: 800 }

  # ── Position / nav lights — STEADY ──
  - channel: "Position lights"
    events:
      - { kind: "on", brightness_pct: 100, duration_ms: 0 }

  # ── White tail (aft position light) — STEADY ──
  - channel: "White tail"
    events:
      - { kind: "on", brightness_pct: 100, duration_ms: 0 }

  # ── White anti-collision strobe — double-flash, ~50/min, offset ──
  - channel: "White strobe"
    loop: true
    events:
      - { kind: "off",                       duration_ms: 600 }
      - { kind: "on",  brightness_pct: 100, duration_ms:  40 }
      - { kind: "off",                       duration_ms:  80 }
      - { kind: "on",  brightness_pct: 100, duration_ms:  40 }
      - { kind: "off",                       duration_ms: 440 }

# Landing light deploys + lights via the LandingLightService.
landing_bindings:
  - { id: 0, state: "on" }
