# Helicopter — Landing (approach, light on)
#
# Same FAA-realistic anti-collision pattern as "Helicopter — Flight"
# (steady position/tail; red beacon flash at ~50 fpm / 1200 ms + white
# strobe double-flash at ~60 fpm / 1000 ms — distinct rates that drift,
# both inside FAA 40–100 fpm) PLUS the landing light ON.
#
# The landing light drives the "Landing light" LED channel directly (a
# plain LedAnimator port on the IO tab) — no servo / LandingLightService
# group required.  If your airframe deploys the landing light on a servo
# instead, configure a LandingLightService group in /landing.yaml and add
# a `landing_bindings: [{ id: <n>, state: "on" }]` block here.

schema_version: 2

tracks:
  # ── Red anti-collision beacon — rotating-style flash, ~50/min ──
  - channel: "Red beacon"
    loop: true
    events:
      - { kind: fade_in,  brightness_pct: 100, duration_ms: 200 }
      - { kind: fade_out, brightness_pct: 100, duration_ms: 200 }
      - { kind: "off",                          duration_ms: 800 }

  # ── Position / nav lights — STEADY ──
  - channel: "Position lights"
    events:
      - { kind: "on", brightness_pct: 100, duration_ms: 0 }

  # ── White tail (aft position light) — STEADY ──
  - channel: "White tail"
    events:
      - { kind: "on", brightness_pct: 100, duration_ms: 0 }

  # ── White anti-collision strobe — double-flash, ~60/min ──
  - channel: "White strobe"
    loop: true
    events:
      - { kind: "on",  brightness_pct: 100, duration_ms:  40 }
      - { kind: "off",                       duration_ms:  80 }
      - { kind: "on",  brightness_pct: 100, duration_ms:  40 }
      - { kind: "off",                       duration_ms: 840 }   # → 1000 ms / 60 fpm

# The landing light is no longer a raw LED track here — it's a LANDING
# GROUP (servo-deployed searchlight + bulb with fade-in) defined in
# /landing.yaml.  Attach the group to this program in the Landing panel
# (or the program editor) and Studio injects the binding below, so the
# group deploys (servo out → bulb fades on) while this program is active
# and retracts (bulb off → servo in) when you switch away.
landing_bindings: []
