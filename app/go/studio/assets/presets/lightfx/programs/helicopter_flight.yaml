# Helicopter — Flight (rotors turning)
#
# FAA-realistic in-flight exterior lighting:
#   • Position/nav lights + tail are STEADY (14 CFR 91.209 — position
#     lights are continuous, never flashing): red port + green starboard
#     paralleled on "Position lights", white aft on "White tail".
#   • Red anti-collision BEACON flashes (rotating-style fade pulse) at
#     ~50 cycles/min (1200 ms) and the white anti-collision STROBE
#     double-flashes at ~60/min (1000 ms) — both inside the FAA 40–100 fpm
#     anti-collision window (14 CFR 27.1401 / 23.1401, EASA CS-27, and
#     MIL-STD-3009).  The two run at DIFFERENT rates, like real independent
#     beacon/strobe systems, so they drift through each other instead of
#     staying locked.
#   • Landing light off in cruise — switch to "Helicopter — Landing".
#
# Each looping track repeats on its OWN period (LedAnimator drives
# `now % period`): beacon 1200 ms, strobe 1000 ms — they keep their own
# cadence and slowly beat against each other.  Steady tracks use a single
# terminal `on` (no loop).  v2 schema — channel names match the
# LedAnimator port labels on the IO tab (see helicopter_off.yaml).

schema_version: 2

tracks:
  # ── Red anti-collision beacon — rotating-style flash, ~50/min ──
  - channel: "Red beacon"
    loop: true
    events:
      - { kind: fade_in,  brightness_pct: 100, duration_ms: 200 }
      - { kind: fade_out, brightness_pct: 100, duration_ms: 200 }
      - { kind: "off",                          duration_ms: 800 }   # → 1200 ms / 50 fpm

  # ── Position / nav lights — STEADY (red port + green starboard) ──
  - channel: "Position lights"
    events:
      - { kind: "on", brightness_pct: 100, duration_ms: 0 }

  # ── White tail (aft position light) — STEADY ──
  - channel: "White tail"
    events:
      - { kind: "on", brightness_pct: 100, duration_ms: 0 }

  # ── White anti-collision strobe — crisp double-flash, ~60/min ──
  - channel: "White strobe"
    loop: true
    events:
      - { kind: "on",  brightness_pct: 100, duration_ms:  40 }   # flash 1
      - { kind: "off",                       duration_ms:  80 }
      - { kind: "on",  brightness_pct: 100, duration_ms:  40 }   # flash 2
      - { kind: "off",                       duration_ms: 840 }   # → 1000 ms / 60 fpm

  - channel: "Landing light"
    events:
      - { kind: "off", duration_ms: 0 }
