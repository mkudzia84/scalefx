; PlatformIO Project Configuration File for Storage Test
;
; Minimal ESP32-S3 firmware for throughput-testing the sfx_storage upload
; protocol (flash + 1-bit SDIO SD). Same pinout as HubFX (CMD=38, CLK=39,
; D0=40) so a DevKitC-1 can be wired to the HubFX SD harness directly.
;
; Build: pio run
; Upload: pio run -t upload
; Monitor: pio device monitor

[env:esp32s3]
; pioarduino platform — Arduino ESP32 v3.x + ESP-IDF v5.5.x
platform = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
board = esp32-s3-devkitc-1
framework = arduino

; 240 MHz for maximum SD throughput headroom
board_build.f_cpu = 240000000L

; DevKitC-1 has two USB ports — UART0 is the USB-UART bridge. cdc_on_boot=0
; keeps the native USB-OTG free (we don't use it but kept consistent with HubFX).
board_build.arduino.cdc_on_boot = 0

; 8MB QIO flash (matches N8R8 module on the DevKitC-1)
board_build.flash_mode = qio
board_build.flash_size = 8MB
board_build.f_flash = 80000000L
board_build.partitions = partitions.csv

; PSRAM — required for the 64 KB PSRAM fill buffer used by the storage policy
board_build.arduino.memory_type = qio_opi

build_unflags = -std=gnu++2b

build_flags =
    -std=gnu++17
    ; Modest debug level (binary COBS stream; verbose logs corrupt it)
    -DCORE_DEBUG_LEVEL=2
    ; Arduino loopTask stack — StreamWriter + COBS buffers are large
    -DARDUINO_LOOP_STACK_SIZE=16384
    ; Storage server only — no audio / no USB host / no config / no engine
    -DSFX_HAS_STORAGE=1
    -DSFX_HAS_STORAGE_SERVER=1
    -DSFX_ENABLE_DIAG_LOG=1
    -DCONFIG_IDF_TARGET_ESP32S3=1

; Shared ScaleFX libraries
lib_extra_dirs = ../../controllers/lib

lib_deps =
    SPI
    SD
    ; ESP32Servo is a transitive dep of sfx_peripherals (unused here but keeps
    ; the library.json resolver happy if anything pulls in sfx_platform servo)
    madhephaestus/ESP32Servo@^3.0.5

; Don't link SdFat (SD_MMC is the ESP32 path).
; sfx_usb is NOT ignored — sfx_serial/client/bus.cpp unconditionally
; includes <usb/sfx_usb_host.h> (slave-controller client bus), so the
; header must be discoverable even though we don't actually drive USB.
lib_ignore =
    SdFat
    sfx_audio
    esp_cdc_acm

; UART0 via USB-UART bridge — COBS protocol at 6 Mbps
monitor_speed = 6000000
monitor_filters = esp32_exception_decoder, direct
monitor_rts = 0
monitor_dtr = 0

upload_protocol = esptool
upload_speed = 921600
