; Audio Test Firmware — Sine Wave Generator
;
; Minimal single-core test to verify I2S → TAS5825M audio path.
; Generates a 440Hz sine wave using raw ESP-IDF I2S driver.
; No ScaleFX libraries, no mixer, no ring buffers.
;
; Purpose: Debug FS_MON=0x00 / POWER_STATE=SLEEP issue.

[env:esp32s3]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
board = esp32-s3-devkitc-1
framework = arduino

board_build.f_cpu = 240000000L
board_build.arduino.cdc_on_boot = 0
board_build.flash_mode = qio
board_build.flash_size = 8MB
board_build.f_flash = 80000000L
board_build.arduino.memory_type = qio_opi

build_unflags = -std=gnu++2b
build_flags =
    -std=gnu++17
    -DCORE_DEBUG_LEVEL=4

; No external libraries needed — everything is inline
lib_deps =
lib_ignore =

monitor_speed = 115200
monitor_filters = esp32_exception_decoder

upload_protocol = esptool
upload_speed = 921600
