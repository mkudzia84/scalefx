; PlatformIO Project Configuration File for SFX Test (P-variant)
;
; TAS5825P audio codec test — standalone sine wave test.
; Target: ESP32-S3 (HubFX board populated with the *original* TAS5825P
; silicon — Hybrid-Pro / Class-H variant, package suffix RHB).
;
; Generates a 440 Hz sine wave via I2S with extensive serial diagnostics.
; No external libraries — uses only Arduino core + ESP-IDF I2S driver.
;
; This is the PROVEN-WORKING firmware for the P silicon. The init flow
; is intentionally permissive about clock-detect timing and does not
; touch smart-amp / IV-sense registers (they don't exist on the P).
; The same flow does NOT come up cleanly on TAS5825M boards — see
; ../sfx_test_m/ for the M-specific init sequence.
;
; Build: pio run
; Upload: pio run -t upload
; Serial Monitor: pio device monitor

[env:esp32s3]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
board = esp32-s3-devkitc-1
framework = arduino

board_build.f_cpu = 240000000L
board_build.arduino.cdc_on_boot = 0
board_build.flash_mode = qio
board_build.flash_size = 8MB
board_build.f_flash = 80000000L
board_build.partitions = partitions.csv
board_build.arduino.memory_type = qio_opi

build_unflags = -std=gnu++2b

build_flags =
    -std=gnu++17
    -DCORE_DEBUG_LEVEL=3

; No external libraries needed
lib_deps =

; Ignore all ScaleFX libraries (not used)
lib_ignore =
    SdFat
    sfx_usb
    sfx_audio
    sfx_storage
    sfx_config
    sfx_serial
    sfx_server
    sfx_platform
    sfx_peripherals
    sfx_boards
    esp_cdc_acm
    ESP32Servo

; Serial monitor
monitor_speed = 115200
monitor_filters = esp32_exception_decoder, direct
monitor_rts = 0
monitor_dtr = 0

upload_protocol = esptool
upload_speed = 921600
