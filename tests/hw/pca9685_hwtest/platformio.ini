; PlatformIO Project Configuration File for PCA9685 Hardware Test
;
; PCA9685 16-channel 12-bit I²C PWM driver bring-up. Targets ESP32-S3
; (any DevKitC-1) with an external PCA9685 module on the I²C bus
; (default address 0x40). Push-pull outputs at 3.3 V drive MOSFET
; gates / LEDs / servos directly — no software PWM, no constant-current
; pull-up trick.
;
; Exercises every observable path of the chip:
;
;   - I²C probe + chip wake-up (clear MODE1.SLEEP)
;   - PRESCALE configuration (PWM frequency 24 Hz – 1526 Hz)
;   - MODE2 push-pull configuration (OUTDRV = 1)
;   - Per-channel 12-bit duty write (LED_n_ON_L/H + LED_n_OFF_L/H,
;     auto-increment writes — one I²C transaction per update)
;   - LEDn_FULL_ON / LEDn_FULL_OFF special-case bits
;   - ALL_LED broadcast registers (single transaction sets all 16)
;
; Output is structured for both human + agent consumption — `[PASS]` /
; `[FAIL]` / `[VERIFY]` / `[STATUS]` markers can be grepped. Line-based
; serial UX: type a number 0..4095 + Enter to set every channel, or
; `<ch>=<value>` for a single channel.
;
; Build: pio run
; Upload: pio run -t upload
; Serial Monitor: pio device monitor
;
; NO external libraries — pure Arduino + Wire.

[env:esp32s3]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
board = esp32-s3-devkitc-1
framework = arduino

board_build.f_cpu = 240000000L
board_build.arduino.cdc_on_boot = 0
board_build.flash_mode = qio
board_build.flash_size = 8MB
board_build.f_flash = 80000000L
board_build.partitions = partitions.csv
board_build.arduino.memory_type = qio_opi

build_unflags = -std=gnu++2b

build_flags =
    -std=gnu++17
    -DCORE_DEBUG_LEVEL=3

lib_deps =

lib_ignore =
    SdFat
    sfx_usb
    sfx_audio
    sfx_storage
    sfx_config
    sfx_serial
    sfx_server
    sfx_platform
    sfx_peripherals
    sfx_boards
    esp_cdc_acm
    ESP32Servo

monitor_speed = 115200
monitor_filters = esp32_exception_decoder, direct
monitor_rts = 0
monitor_dtr = 0

upload_protocol = esptool
upload_speed = 921600
