; hubfx_usb_probe — minimal pure-ESP-IDF USB-OTG HOST enumeration probe.
;
; Purpose: isolate HW vs SW when expanders stop mounting on the HubFX host
; ports.  Flash THIS, watch UART0 at 115200 (plain text console — no COBS),
; plug a board into a hub host port:
;   - probe prints VID/PID on mount  -> hardware path is fine, bug is in the
;     production firmware (ExpanderService / config)
;   - probe prints nothing            -> hardware (cable / hub chip / VBUS)
;
; Same partition table as production so flashing the probe does NOT move the
; littlefs region (configs survive).  Reflash the real firmware afterwards:
;   app/go/scalefx-flash.exe flash hubfx
[env:esp32s3]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
board = esp32-s3-devkitc-1
framework = espidf

board_build.flash_mode  = qio
board_build.flash_size  = 8MB
board_build.f_flash     = 80000000L
board_build.partitions  = partitions.csv

monitor_speed   = 115200
monitor_filters = esp32_exception_decoder, direct

upload_protocol = esptool
upload_speed    = 921600
