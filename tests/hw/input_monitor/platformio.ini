; PlatformIO Project Configuration File for Input Monitor
;
; Bring-up rig for the HubFX IN_1 input header (GPIO5).  Experiment
; firmware to validate an inbound RC signal before trusting the
; production input path.  Built in phases:
;
;   Phase 1 (now)  — MODE_PWM:  measure a single RC PWM channel's pulse
;                    width (rising→falling), print µs + frequency + a bar.
;                    Confirms the signal is wired + readable at all.
;   Phase 2 (next) — MODE_PPM:  decode a composite PPM sum-signal into N
;                    channels (see tests/hw/ppm_test for the decoder).
;   Phase 3        — MODE_SBUS: 100000 8E2 inverted UART frame decode.
;
; Select the mode with -DMONITOR_MODE below (default = PWM).
; Plain human-readable Serial @ 115200 on UART0 (the CH343 bridge);
; cdc_on_boot=0 so OTG stays free.  NO ScaleFX libraries.
;
; Build:   pio run
; Upload:  pio run -t upload
; Monitor: pio device monitor   (115200, no DTR/RTS so it won't reset)

[env:esp32s3]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
board = esp32-s3-devkitc-1
framework = arduino

board_build.f_cpu = 240000000L
board_build.arduino.cdc_on_boot = 0
board_build.flash_mode = qio
board_build.flash_size = 8MB
board_build.f_flash = 80000000L
board_build.partitions = partitions.csv
board_build.arduino.memory_type = qio_opi

build_unflags = -std=gnu++2b

build_flags =
    -std=gnu++17
    -DCORE_DEBUG_LEVEL=3
    ; Input decode mode: 0 = PWM (single channel), 1 = PPM, 2 = SBUS, 3 = JETI EX Bus.
    -DMONITOR_MODE=3
    ; PPM: how many channels you expect (auto-detect still runs; this only flags match).
    -DPPM_EXPECTED_CH=9
    ; JETI EX Bus baud: 125000 (default) or 250000.
    -DJETI_BAUD=125000

lib_deps =

; Pure Arduino — ignore every ScaleFX library.
lib_ignore =
    SdFat
    sfx_usb
    sfx_audio
    sfx_storage
    sfx_config
    sfx_serial
    sfx_server
    sfx_platform
    sfx_peripherals
    sfx_boards
    esp_cdc_acm
    ESP32Servo

monitor_speed = 115200
monitor_filters = esp32_exception_decoder, direct
monitor_rts = 0
monitor_dtr = 0

upload_protocol = esptool
upload_speed = 921600
