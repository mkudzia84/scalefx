; PlatformIO Project Configuration File for HubFX PCA9685 Hardware Test
;
; Bring-up firmware for the 8-channel HubFX PCB rev (TAS5825P + PCA9685
; + 8× INA226). Drives the eight LED-rail PWM channels on PCA9685 LED0
; through LED7 with a synchronised gamma-corrected breathing animation.
; All eight channels are updated atomically in a single I²C transaction
; via the ALL_LED broadcast registers so there is zero phase drift
; between channels.
;
; Target: ESP32-S3 on the HubFX board (any rev that exposes the standard
; I²C bus at SDA=GPIO8 / SCL=GPIO9 and populates PCA9685 at 0x70).
;
; Build: pio run
; Upload: pio run -t upload
; Serial Monitor: pio device monitor
;
; NO external libraries — pure Arduino + Wire. See PINOUT.md in
; controllers/hubfx/esp32s3/ for the full board pinout reference.

[env:esp32s3]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
board = esp32-s3-devkitc-1
framework = arduino

board_build.f_cpu = 240000000L
board_build.arduino.cdc_on_boot = 0
board_build.flash_mode = qio
board_build.flash_size = 8MB
board_build.f_flash = 80000000L
board_build.partitions = partitions.csv
board_build.arduino.memory_type = qio_opi

build_unflags = -std=gnu++2b

build_flags =
    -std=gnu++17
    -DCORE_DEBUG_LEVEL=3

lib_deps =

lib_ignore =
    SdFat
    sfx_usb
    sfx_audio
    sfx_storage
    sfx_config
    sfx_serial
    sfx_server
    sfx_platform
    sfx_peripherals
    sfx_boards
    esp_cdc_acm
    ESP32Servo

monitor_speed = 115200
monitor_filters = esp32_exception_decoder, direct
monitor_rts = 0
monitor_dtr = 0

upload_protocol = esptool
upload_speed = 921600
