; PlatformIO Project Configuration File for HubFX I²C Bus Scanner
;
; Minimal-scope diagnostic firmware: bring up I²C on the HubFX pins
; (SDA=GPIO8, SCL=GPIO9, 100 kHz), scan every address in 0x08..0x7F
; once every 2 seconds, print which addresses ACK and which expected
; devices are missing.
;
; No register writes, no audio, no LEDs (other than the heartbeat).
; Use this to bisect "did our test damage the chip" questions or to
; watch a marginal solder joint come and go live (wiggle U54 while the
; scan runs).
;
; Build: pio run
; Upload: pio run -t upload
; Serial Monitor: pio device monitor
;
; NO external libraries — pure Arduino + Wire.

[env:esp32s3]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
board = esp32-s3-devkitc-1
framework = arduino

board_build.f_cpu = 240000000L
board_build.arduino.cdc_on_boot = 0
board_build.flash_mode = qio
board_build.flash_size = 8MB
board_build.f_flash = 80000000L
board_build.partitions = partitions.csv
board_build.arduino.memory_type = qio_opi

build_unflags = -std=gnu++2b

build_flags =
    -std=gnu++17
    -DCORE_DEBUG_LEVEL=3

lib_deps =

lib_ignore =
    SdFat
    sfx_usb
    sfx_audio
    sfx_storage
    sfx_config
    sfx_serial
    sfx_server
    sfx_platform
    sfx_peripherals
    sfx_boards
    esp_cdc_acm
    ESP32Servo

monitor_speed = 115200
monitor_filters = esp32_exception_decoder, direct
monitor_rts = 0
monitor_dtr = 0

upload_protocol = esptool
upload_speed = 921600
