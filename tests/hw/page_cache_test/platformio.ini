; ============================================================================
;  Page Cache Test — cross-core SD paging validation harness
; ============================================================================
;
; Standalone ESP32-S3 firmware that exercises the production page-cache
; pattern (consumer on Core 1 prio MAX-2 + reader on Core 1 prio MAX-3,
; SD mounted via ESP-IDF native VFS-FAT) without any protocol or codec
; baggage.  Plain-text Serial output at 115200 baud.
;
; SD pinout matches HubFX 4-bit SDIO — flash to a HubFX board or wire a
; DevKitC-1 to the same harness:
;   CLK=39  CMD=38  D0=40  D1=41  D2=42  D3=45
;
; Build:    pio run
; Upload:   pio run -t upload
; Monitor:  pio device monitor   (NOT COBS — plain text)
;
; Test programs are picked by the firmware default OR by typing one of
; these into the serial monitor at runtime:
;   linear /sounds/KA50/engine_start.wav
;   loop   /sounds/KA50/engine_loop.wav  5
;   multi  /sounds/KA50/engine_loop.wav  /sounds/2A42/gun_550rpm.wav
;
; See src/page_cache_test.ino for the dispatcher.

[env:esp32s3]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
board    = esp32-s3-devkitc-1
framework = arduino

board_build.f_cpu                  = 240000000L
board_build.arduino.cdc_on_boot    = 0
board_build.flash_mode             = qio
board_build.flash_size             = 8MB
board_build.f_flash                = 80000000L
board_build.partitions             = partitions.csv
board_build.arduino.memory_type    = qio_opi

build_unflags = -std=gnu++2b

build_flags =
    -std=gnu++20
    -DCORE_DEBUG_LEVEL=3
    -DARDUINO_LOOP_STACK_SIZE=16384
    -DCONFIG_IDF_TARGET_ESP32S3=1

; No external libraries needed — only standard <esp_vfs_fat.h> +
; <driver/sdmmc_host.h> from the Arduino-ESP32 framework bundle.
lib_deps =

; Plain UART for telemetry — NOT 6 Mbps COBS.
monitor_speed   = 115200
monitor_filters = esp32_exception_decoder, direct
monitor_rts     = 0
monitor_dtr     = 0

upload_protocol = esptool
upload_speed    = 921600
