; PlatformIO Project Configuration — HubFX LED Blink Test
;
; Bare-metal I2C LED blink test for PCAL6416A GPIO expander.
; No ScaleFX libraries — uses only Arduino Wire library.
;
; Hardware:
;   Board:    ESP32-S3-DevKitC-1 (WROOM-1 N8R8)
;   I2C:      SDA=GPIO8, SCL=GPIO9, 100kHz, 4.7kΩ pull-ups
;   Expander: PCAL6416A @ 0x20 (Port 0 = 8 LED channels)
;
; Build: pio run
; Upload: pio run -t upload
; Monitor: pio device monitor

[env:esp32s3]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
board = esp32-s3-devkitc-1
framework = arduino

board_build.f_cpu = 240000000L
board_build.arduino.cdc_on_boot = 0
board_build.flash_mode = qio
board_build.flash_size = 8MB
board_build.f_flash = 80000000L
board_build.partitions = partitions.csv
board_build.arduino.memory_type = qio_opi

build_unflags = -std=gnu++2b

build_flags =
    -std=gnu++17
    -DCORE_DEBUG_LEVEL=3

; No external libraries — just Wire (built-in)
lib_deps =

; Ignore all ScaleFX libraries
lib_ignore =
    SdFat
    sfx_usb
    sfx_audio
    sfx_storage
    sfx_config
    sfx_serial
    sfx_server
    sfx_platform
    sfx_peripherals
    sfx_boards
    esp_cdc_acm
    ESP32Servo

; Serial monitor at 115200 for human-readable output
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
monitor_rts = 0
monitor_dtr = 0

upload_protocol = esptool
upload_speed = 921600
