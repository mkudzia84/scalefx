; PlatformIO Project Configuration File for HubFX A/V Hardware Test
;
; Combined bring-up firmware exercising both subsystems on the HubFX
; 8-channel rev:
;   - TAS5825P audio codec (I²C 0x4C, I²S DOUT=GPIO16 BCLK=GPIO17 LRCLK=GPIO18)
;     driving a 440 Hz sine wave with amplitude envelope
;   - PCA9685 LED PWM driver (I²C 0x70) driving 8 LED rails via ALL_LED
;     broadcast at 1526 Hz PWM, 12-bit duty
;
; The audio amplitude envelope and the LED PWM duty are both driven from
; the same `breathingEnvelope(elapsed_ms)` function — a gamma-corrected
; sin² curve over a configurable period. Result: the LEDs fade in/out
; in sync with the tone fading in/out. Confirms that:
;
;   - Both I²C devices coexist on the shared bus (TAS5825P doesn't get
;     reset by PCA9685 register writes, and vice versa).
;   - Continuous I²S TX from the ESP32 doesn't disturb I²C transactions
;     to the PCA9685.
;   - Two independent FreeRTOS tasks (Core 0 LED + Core 1 audio) can
;     share Wire and time without contention.
;
; See ../hubfx_pca9685_hwtest/README.md for the PCA9685 init details
; and ../sfx_test_p/ for the TAS5825P init details.
;
; Build: pio run
; Upload: pio run -t upload
; Serial Monitor: pio device monitor
;
; NO external libraries — pure Arduino + Wire + ESP-IDF I²S driver.

[env:esp32s3]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
board = esp32-s3-devkitc-1
framework = arduino

board_build.f_cpu = 240000000L
board_build.arduino.cdc_on_boot = 0
board_build.flash_mode = qio
board_build.flash_size = 8MB
board_build.f_flash = 80000000L
board_build.partitions = partitions.csv
board_build.arduino.memory_type = qio_opi

build_unflags = -std=gnu++2b

build_flags =
    -std=gnu++17
    -DCORE_DEBUG_LEVEL=3

lib_deps =

lib_ignore =
    SdFat
    sfx_usb
    sfx_audio
    sfx_storage
    sfx_config
    sfx_serial
    sfx_server
    sfx_platform
    sfx_peripherals
    sfx_boards
    esp_cdc_acm
    ESP32Servo

monitor_speed = 115200
monitor_filters = esp32_exception_decoder, direct
monitor_rts = 0
monitor_dtr = 0

upload_protocol = esptool
upload_speed = 921600
