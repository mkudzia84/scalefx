; tas5825m_beep — minimal pure-ESP-IDF TAS5825M codec bring-up probe.
;
; Purpose: verify the audio path (ESP32-S3 I2S -> TAS5825M -> speaker) on
; boards carrying M-variant silicon, independent of the production firmware.
; Flash THIS, watch UART0 at 115200 (plain text console — no COBS):
;   - every codec register write is logged WITH a readback verify
;   - the M-strict init sequence (CDET clear, FS_MON gate, HIZ->PLAY) is
;     stepped through with per-step results
;   - a 1 kHz beep plays 200 ms on / 800 ms off
;   - a 2 s heartbeat dumps POWER_STATE / FS_MON / fault registers with
;     bit decodes, and auto-recovers PLAY after a latched fault
;
; Same partition table as production so flashing the probe does NOT move the
; littlefs region (configs survive).  Reflash the real firmware afterwards:
;   app/go/scalefx-flash.exe flash hubfx
[env:esp32s3]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
board = esp32-s3-devkitc-1
framework = espidf

board_build.flash_mode  = qio
board_build.flash_size  = 8MB
board_build.f_flash     = 80000000L
board_build.partitions  = partitions.csv

monitor_speed   = 115200
monitor_filters = esp32_exception_decoder, direct

upload_protocol = esptool
upload_speed    = 921600
