; HubFX I2C probe — minimal "noop" bring-up firmware.
; Scans the I2C bus (SDA=GPIO8, SCL=GPIO9) and identifies INA226 / PCA9685 /
; TAS5825P, printing over UART0 (→ CH343 → USB0) at 115200.  Use it to confirm
; the I2C map on a fresh/unproven HubFX board WITHOUT the full firmware.
;
; Flash:   pio run -e i2cprobe -t upload --upload-port COMxx
; Read:    pio device monitor -e i2cprobe -p COMxx    (115200)

[env:i2cprobe]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
board = esp32-s3-devkitc-1
framework = espidf
board_build.flash_size = 8MB
board_build.flash_mode = qio
monitor_speed  = 115200
upload_protocol = esptool
upload_speed    = 921600
