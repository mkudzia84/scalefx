; PlatformIO Project Configuration File for SFX Test (M-variant)
;
; TAS5825M audio codec test — standalone sine wave test.
; Target: ESP32-S3 (HubFX board populated with TAS5825M silicon —
; inductor-less Class-D + smart-amp variant, package suffix RHB).
;
; Differs from ../sfx_test_p/ in three init steps that the M
; explicitly enforces and the P happily ignored:
;
;   1. Smart-amp speaker protection is DISABLED before PLAY.
;      The M ships with IV-sense + speaker-protection latch armed
;      out of reset; without an explicit disable it can hold
;      DEVICE_CTRL2 at HIZ even with valid clocks present.
;
;   2. FS_MON (0x37) is POLLED for a valid sample-rate code before
;      the HIZ → PLAY transition. The P would auto-detect during the
;      transition; the M wants the rate already locked or it stays
;      in HIZ.
;
;   3. GPIO1_SEL is set to "FAULT" mode (the M reserves the
;      Hybrid-Pro value the P uses there, so a leftover P-flow write
;      leaves GPIO1 in an undefined state on M silicon).
;
; Sources for the M-only requirements:
;   - TAS5825M datasheet §7.5.2 (clock detection)
;   - TAS5825M Advanced Features (SLAA846) — smart-amp init
;   - TI E2E forum note: "firmware between TAS5825M and TAS5825P is
;     different so you couldn't use the same TAS5825M process flows
;     on a TAS5825P as it may not function properly"
;
; Build: pio run
; Upload: pio run -t upload
; Serial Monitor: pio device monitor

[env:esp32s3]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
board = esp32-s3-devkitc-1
framework = arduino

board_build.f_cpu = 240000000L
board_build.arduino.cdc_on_boot = 0
board_build.flash_mode = qio
board_build.flash_size = 8MB
board_build.f_flash = 80000000L
board_build.partitions = partitions.csv
board_build.arduino.memory_type = qio_opi

build_unflags = -std=gnu++2b

build_flags =
    -std=gnu++17
    -DCORE_DEBUG_LEVEL=3

; No external libraries needed
lib_deps =

; Ignore all ScaleFX libraries (not used)
lib_ignore =
    SdFat
    sfx_usb
    sfx_audio
    sfx_storage
    sfx_config
    sfx_serial
    sfx_server
    sfx_platform
    sfx_peripherals
    sfx_boards
    esp_cdc_acm
    ESP32Servo

; Serial monitor
monitor_speed = 115200
monitor_filters = esp32_exception_decoder, direct
monitor_rts = 0
monitor_dtr = 0

upload_protocol = esptool
upload_speed = 921600
