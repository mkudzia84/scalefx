; PlatformIO Project Configuration File for HubFX Local LED Hardware Test
;
; HubFX local LED bring-up test. Targets ESP32-S3 (HubFX board) with the
; on-board AW9523B I²C GPIO/LED-driver expander at 0x58. Drives the 6
; LED channels wired to P0_0..P0_5 in LED-mode (constant current with
; 256-step PWM) and exercises every observable path:
;
;   - I²C probe + register dump
;   - Soft reset round-trip
;   - LED-mode configuration + readback verification
;   - Per-channel sweep (1 channel at a time, 0→100→0 over 2 s)
;   - All-channel sinusoidal breathing
;   - Chase pattern (single moving dot)
;   - Brightness register readback verification (writes 0..255 to every
;     channel, reads back, flags any mismatch)
;
; Output is structured for both human + agent consumption — `[PASS]` /
; `[FAIL]` / `[INFO]` / `[VERIFY]` / `[STATUS]` markers can be grepped.
; Pattern mode selectable via single-character serial commands (1..6).
;
; Build: pio run
; Upload: pio run -t upload
; Serial Monitor: pio device monitor
;
; NO external libraries — pure Arduino + ESP-IDF I²C.

[env:esp32s3]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
board = esp32-s3-devkitc-1
framework = arduino

board_build.f_cpu = 240000000L
board_build.arduino.cdc_on_boot = 0
board_build.flash_mode = qio
board_build.flash_size = 8MB
board_build.f_flash = 80000000L
board_build.partitions = partitions.csv
board_build.arduino.memory_type = qio_opi

build_unflags = -std=gnu++2b

build_flags =
    -std=gnu++17
    -DCORE_DEBUG_LEVEL=3

lib_deps =

lib_ignore =
    SdFat
    sfx_usb
    sfx_audio
    sfx_storage
    sfx_config
    sfx_serial
    sfx_server
    sfx_platform
    sfx_peripherals
    sfx_boards
    esp_cdc_acm
    ESP32Servo

monitor_speed = 115200
monitor_filters = esp32_exception_decoder, direct
monitor_rts = 0
monitor_dtr = 0

upload_protocol = esptool
upload_speed = 921600
