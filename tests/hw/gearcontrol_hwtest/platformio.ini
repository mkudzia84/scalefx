; PlatformIO Project Configuration — GearControl Hardware Smoke Test
;
; Standalone test firmware for the GearControl PCB: exercises every physical
; pin without the ScaleFX protocol so a freshly-populated board can be
; verified end-to-end against a multimeter, servo, motor, and scope.
;
; What it does, continuously:
;   - Sweeps all 7 servo slots (pin1..pin7) through 500–2500µs (period ~4s)
;   - Cycles each motor H-bridge CW → stop → CCW → stop (~3 s/pair),
;     lighting the matching status LED during each half-cycle
;   - Blinks GP13/GP14 indicator LEDs as a heartbeat
;   - Captures the GP0 RC PWM input (pulse width in µs) via interrupt
;   - Samples the GP29 battery ADC (÷6 divider) and reports millivolts
;   - Scans the I²C bus once at boot and reports any device addresses found
;
; Output:
;   Serial @ 6 Mbps. One CSV-style line every 500 ms:
;     t=<ms> servo=<us> gearIn=<us> batt=<mV> motor=<phase> leds=<mask>
;
; Build: pio run
; Upload: pio run -t upload (hold BOOTSEL while plugging in USB for initial flash)
; Monitor: pio device monitor

[env:pico]
platform = https://github.com/maxgerhardt/platform-raspberrypi.git
board = pico
framework = arduino
board_build.core = earlephilhower

; No ScaleFX libraries — bare Arduino + Servo (built into core) + Wire.
lib_deps =
lib_ignore =
    sfx_usb
    sfx_audio
    sfx_storage
    sfx_config
    sfx_serial
    sfx_server
    sfx_platform
    sfx_peripherals
    sfx_boards
    esp_cdc_acm
    ESP32Servo

; USB descriptor — advertise as a dedicated "HWTest" device so the host OS
; doesn't confuse it with a normal GearControl board.
board_build.arduino.earlephilhower.usb_vid = 0x2e8a
board_build.arduino.earlephilhower.usb_pid = 0x0183
board_build.arduino.earlephilhower.usb_manufacturer = ScaleFX
board_build.arduino.earlephilhower.usb_product = GearControl-HWTest

; Serial monitor matches the production GearControl baud so existing tools
; "just work" if the user forgets to switch.
monitor_speed = 6000000

; Upload over USB (mass storage) — requires BOOTSEL mode on first flash.
upload_protocol = picotool
