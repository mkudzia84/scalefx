; PlatformIO Project Configuration File — USB Host Device Detector (ESP32-S3)
;
; MINIMAL "dumb" diagnostic firmware to isolate why the HubFX isn't
; enumerating a plugged-in USB CDC expander.
;
; What it does:
;   * Brings up the ESP32-S3 native USB-OTG host (internal PHY, GPIO19 D-/GPIO20 D+)
;     via the shared sfx_usb EspUsbHost + vendored esp_cdc_acm driver.
;   * Explicitly powers the root port (usb_host_lib_set_root_port_power(true)) —
;     EspUsbHost::begin()/init() do NOT do this at install time (only on recovery).
;   * Prints every device that connects (VID/PID) + a 1 Hz heartbeat to a
;     PLAIN-TEXT console on UART0 (the CH343 → COMxx), NOT USB-Serial-JTAG.
;
; The console is DELIBERATELY on UART (CONFIG_ESP_CONSOLE_UART_DEFAULT=y) with
; USB-Serial-JTAG disabled (see sdkconfig.defaults) so it does NOT contend with
; the USB-OTG internal PHY on GPIO19/20 — the suspected root cause on the hub
; (whose sdkconfig sets CONFIG_ESP_CONSOLE_USB_SERIAL_JTAG=y, hard-wired to the
; same single internal USB PHY the host needs).
;
; Build:   pio run -e esp32s3
; Upload:  pio run -e esp32s3 -t upload   (DO NOT — no board access in this task)
; Monitor: pio device monitor   (115200 baud, plain text, on the CH343 COM port)

[env:esp32s3]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
board = esp32-s3-devkitc-1
framework = espidf

; Flash + PSRAM (ESP32-S3-WROOM-1 N8R8: 8 MB QIO flash, 8 MB OPI PSRAM).
; Matching CONFIG_* live in sdkconfig.defaults; these drive the uploader.
board_build.flash_mode  = qio
board_build.flash_size  = 8MB
board_build.f_flash     = 80000000L
board_build.partitions  = partitions.csv

build_flags =
    ; No diag wire — SFX_LOG_* compile to no-ops, DiagLog becomes a stub so
    ; sfx_usb compiles standalone without the full serial/board stack.
    -DSFX_ENABLE_DIAG_LOG=0
; NO audio / storage / config flags — this is a USB-host-only probe.

; Console is the IDF UART console (see sdkconfig.defaults) — plain text @115200.
monitor_speed   = 115200
monitor_filters = esp32_exception_decoder, direct
monitor_rts     = 0
monitor_dtr     = 0

upload_protocol = esptool
upload_speed    = 921600
