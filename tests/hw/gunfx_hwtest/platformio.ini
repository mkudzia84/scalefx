; PlatformIO Project Configuration — GunFX Hardware Smoke Test
;
; Standalone test firmware for the GunFX PCB: exercises every physical
; pin without the ScaleFX protocol so a freshly-populated board can be
; verified end-to-end against a multimeter, servo, heater coil, and fan.
;
; What it does, continuously:
;   - Sweeps all 3 gun servos (SRV1..SRV3 on GP1..GP3) 500–2500µs (~4 s/cycle)
;   - Drives the smoke heater relay (GP17) steady HIGH
;   - Drives the smoke fan (GP16) at ~98 % duty PWM (analogWrite 250)
;   - Blinks GP13 / GP14 indicator LEDs as a heartbeat
;   - Captures the GP0 RC PWM trigger input (pulse width in µs) via ISR
;   - Samples the GP29 battery ADC (÷6 divider) and reports millivolts
;
; Output:
;   Serial @ 6 Mbps. One CSV-style line every 500 ms:
;     t=<ms> servo=<us> trigIn=<us> batt=<mV> heater=on fan=<duty>
;
; SAFETY: the smoke heater is a real resistive heating element. Before
; powering the board, confirm you have adequate supply current, proper
; thermal fusing, and nothing flammable near the nozzle. You can comment
; out HEATER_ENABLE below if you only want to test the servos + fan.
;
; Build: pio run
; Upload: pio run -t upload (hold BOOTSEL while plugging in USB for initial flash)
; Monitor: pio device monitor

[env:pico]
platform = https://github.com/maxgerhardt/platform-raspberrypi.git
board = pico
framework = arduino
board_build.core = earlephilhower

; No ScaleFX libraries — bare Arduino + Servo (built into the earlephilhower core).
lib_deps =
lib_ignore =
    sfx_usb
    sfx_audio
    sfx_storage
    sfx_config
    sfx_serial
    sfx_server
    sfx_platform
    sfx_peripherals
    sfx_boards
    esp_cdc_acm
    ESP32Servo

; USB descriptor — advertise as a distinct HWTest device so the host OS
; doesn't confuse it with a normal GunFX board.
board_build.arduino.earlephilhower.usb_vid = 0x2e8a
board_build.arduino.earlephilhower.usb_pid = 0x0184
board_build.arduino.earlephilhower.usb_manufacturer = ScaleFX
board_build.arduino.earlephilhower.usb_product = GunFX-HWTest

monitor_speed = 6000000

; Upload over USB (mass storage) — requires BOOTSEL mode on first flash.
upload_protocol = picotool
