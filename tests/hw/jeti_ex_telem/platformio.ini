; PlatformIO config — Jeti EX Bus telemetry RESPONDER bench rig.
;
; Experiment to validate the half-duplex turnaround the production
; concentrator needs: read RC channel data from a Jeti receiver on IN_1
; (GPIO5) AND respond to the receiver's telemetry polls with two sensors —
;   HubFx:Random  (a random number, changes every response)
;   HubFx:Version (the firmware version, constant)
;
; Half-duplex method (from the Sepp62/JetiExBus ESP32 implementation): the
; pin defaults to RX-only via the GPIO matrix (pinMatrixOutDetach); UART TX
; is attached (pinMatrixOutAttach) ONLY during the response, then detached
; back to RX.  This is NOT UART_MODE_RS485_HALF_DUPLEX (which broke RX on
; the input_monitor bench).
;
; Self-contained — no ScaleFX libraries.  Console (channels + diag) on UART0
; @ 115200 via the CH343 bridge; Jeti EX Bus on UART1 (GPIO5) @ 125000 8N1.
;
; Build:   pio run
; Upload:  pio run -t upload
; Monitor: pio device monitor   (115200, no DTR/RTS so it won't reset)

[env:esp32s3]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
board = esp32-s3-devkitc-1
framework = arduino

board_build.f_cpu = 240000000L
board_build.arduino.cdc_on_boot = 0
board_build.flash_mode = qio
board_build.flash_size = 8MB
board_build.f_flash = 80000000L
board_build.partitions = partitions.csv
board_build.arduino.memory_type = qio_opi

build_unflags = -std=gnu++2b
build_flags =
    -std=gnu++17
    -DCORE_DEBUG_LEVEL=3
    ; Jeti EX Bus baud: 125000 (default) or 250000.
    -DJETI_BAUD=125000

lib_deps =
lib_ignore =
    SdFat
    sfx_usb
    sfx_audio
    sfx_storage
    sfx_config
    sfx_serial
    sfx_server
    sfx_platform
    sfx_peripherals
    sfx_boards
    esp_cdc_acm
    ESP32Servo

monitor_speed = 115200
monitor_filters = esp32_exception_decoder, direct
monitor_rts = 0
monitor_dtr = 0

upload_protocol = esptool
upload_speed = 921600
