; PlatformIO Configuration — Pico 2 WAV File Mixer (SPSC Ring Buffer)
;
; Dual-core audio mixer for Pico 2 (RP2350) with Waveshare Pico-Audio
; board (PCM5101A DAC, 3-wire I2S) and SD card for WAV playback.
;
; Core 0: WAV decode + sine generation + float mixing (producer) + serial UI
; Core 1: I2S DMA output (consumer) — reads from SPSC ring buffer
;
; I2S Pins:  DIN=GP26  BCK=GP27  LRCLK=GP28
; SD Pins:   CS=GP17   SCK=GP18  MOSI=GP19  MISO=GP16
;
; Build:  pio run
; Flash:  pio run -t upload  (or drag .uf2 in BOOTSEL mode)
; Monitor: pio device monitor -b 115200

[env:pico2]
platform = https://github.com/maxgerhardt/platform-raspberrypi.git
board = rpipico2
framework = arduino
board_build.core = earlephilhower

monitor_speed = 115200
upload_protocol = picotool

lib_deps =
    adafruit/SdFat - Adafruit Fork

lib_ignore = SdFat
