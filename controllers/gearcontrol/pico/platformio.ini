[env:pico]
platform = https://github.com/maxgerhardt/platform-raspberrypi.git
board = pico
framework = arduino
board_build.core = earlephilhower

; Shared ScaleFX libraries
lib_extra_dirs = ../../lib

; Note: Servo support is built into the earlephilhower core, no external lib needed
lib_ignore = 
    Servo
    sfx_usb
    sfx_audio
    esp_cdc_acm

monitor_speed = 6000000

; Upload over USB (mass storage)
upload_protocol = picotool

; Reserve flash for LittleFS so /gearcontrol.yaml round-trips work.
; earlephilhower core defaults filesystem_size=0 → LittleFS.begin() fails →
; every FILE_* packet NACKs with NOT_INITIALIZED. 1 MB is plenty for a
; handful of YAML configs and is auto-formatted on first boot.
board_build.filesystem_size = 1m

; USB descriptor overrides (earlephilhower core built-in USB stack)
board_build.arduino.earlephilhower.usb_vid = 0x2e8a
board_build.arduino.earlephilhower.usb_pid = 0x0182
board_build.arduino.earlephilhower.usb_manufacturer = ScaleFX
board_build.arduino.earlephilhower.usb_product = GearControl

; C++20 across the codebase for template-policy applier scaffolding (concepts).
; earlephilhower core defaults to -std=gnu++17 — must unflag before overriding.
build_unflags =
    -std=gnu++17
build_flags =
    -std=gnu++20
    -DSCALEFX_SERVER=1
    -DSFX_HAS_STORAGE=1
    -DSFX_HAS_STORAGE_SERVER=1

; Monitor settings
monitor_filters = 
    default
    log2file
