[env:pico]
platform = https://github.com/maxgerhardt/platform-raspberrypi.git
board = pico
framework = arduino
board_build.core = earlephilhower

; Shared ScaleFX libraries
lib_extra_dirs = ../../lib

; Required libraries
lib_deps =
    Wire

; Servo support built into earlephilhower core
lib_ignore = 
    Servo

monitor_speed = 115200

; Upload over USB (mass storage)
upload_protocol = picotool

; Build flags - SCALEFX_SERVER excludes USB host code from serial library
build_flags = 
    -DCFG_TUSB_CONFIG_FILE=\"tusb_config.h\"
    -DUSE_TINYUSB=1
    -DSCALEFX_SERVER=1

; Monitor settings
monitor_filters = 
    default
    log2file
