[env:pico]
platform = https://github.com/maxgerhardt/platform-raspberrypi.git
board = pico
framework = arduino
board_build.core = earlephilhower

; Shared ScaleFX libraries
lib_extra_dirs = ../../lib

; Thin expander — no audio, no USB host, no on-device storage/config
; (the HubFX master owns all control logic + sequencing).
lib_ignore =
    Servo
    sfx_usb
    sfx_audio
    sfx_storage
    sfx_config
    esp_cdc_acm

monitor_speed = 6000000

; Upload over USB (mass storage)
upload_protocol = picotool

; USB descriptor overrides (earlephilhower core built-in USB stack)
board_build.arduino.earlephilhower.usb_vid = 0x2e8a
board_build.arduino.earlephilhower.usb_pid = 0x0183
board_build.arduino.earlephilhower.usb_manufacturer = ScaleFX
board_build.arduino.earlephilhower.usb_product = PortExpander

; C++20 for policy-based BoardServer (concepts + requires-clauses)
build_unflags =
    -std=gnu++17
build_flags =
    -std=gnu++20
    -DSCALEFX_SERVER=1

; Monitor settings
monitor_filters =
    default
    log2file
