; PlatformIO Project Configuration File for HubFX ESP32-S3
;
; HubFX - Scale model special effects controller
; Target: ESP32-S3 (dual Xtensa LX7 cores, 240 MHz)
;
; Dual-Core Architecture:
;   Core 0: SD card reading, WAV decoding, serial protocol, slave management
;   Core 1: Audio I2S output, mixer consumer loop
;
; Features (to be migrated from HubFX Pico):
;   - 8-channel software audio mixer
;   - I2S audio output (48kHz, 16-bit stereo)
;   - SD card for WAV files and YAML config
;   - Engine sound effects (RPM-based)
;   - Gun sound effects (with slave controller support)
;   - USB Host for connecting to slave controllers
;
; Build: pio run
; Upload: pio run -t upload
; Serial Monitor: pio device monitor

[env:esp32s3]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino

; CPU clock — ESP32-S3 supports 80/160/240 MHz
; Use 240 MHz for maximum audio processing headroom
board_build.f_cpu = 240000000L

; USB-OTG peripheral is reserved for USB Host mode (connecting to slave controllers).
; Serial debug uses UART0 via the USB-UART bridge chip on the DevKitC-1 board.
; Do NOT set cdc_on_boot=1 — it conflicts with USB Host mode (same peripheral).
board_build.arduino.cdc_on_boot = 0

; Flash configuration
; ESP32-S3-WROOM-1 N8R8: 8MB QIO flash + 8MB OPI PSRAM
board_build.flash_mode = qio
board_build.flash_size = 8MB
board_build.f_flash = 80000000L
board_build.partitions = partitions.csv

; PSRAM configuration — REQUIRED for N8R8 module with OPI PSRAM
; Selects the qio_opi SDK variant (QIO flash + Octal PSRAM)
board_build.arduino.memory_type = qio_opi

build_flags =
    ; Core debug level (0=none, 1=error, 2=warn, 3=info, 4=debug, 5=verbose)
    -DCORE_DEBUG_LEVEL=2
    ; === Component Feature Flags ===
    ; Enable audio and storage components (compiled out for controllers that don't use them)
    -DSFX_HAS_AUDIO=1
    -DSFX_HAS_STORAGE=1
    ; Enable DiagLog diagnostic logging (SFX_LOG_* macros)
    -DSFX_ENABLE_DIAG_LOG=1
    ; ESP32-S3 specific target flag
    -DCONFIG_IDF_TARGET_ESP32S3=1
    ; === Audio Configuration ===
    ; Uncomment to override defaults from audio_config.h
    ; -DAUDIO_SAMPLE_RATE=48000
    ; -DAUDIO_MAX_CHANNELS=8
    ; -DAUDIO_MOCK_I2S=1

; Shared ScaleFX libraries
lib_extra_dirs = ../../lib

; Library dependencies
lib_deps =
    ; SD card library
    SPI
    SD
    ; Servo control (required by sfx_platform.h servo abstraction)
    madhephaestus/ESP32Servo

; Ignore framework-bundled SdFat if present
lib_ignore = SdFat

; Serial monitor — UART0 via USB-UART bridge (2Mbps, binary COBS protocol)
; Use `direct` filter to bypass PlatformIO's line-oriented monitor
; (COBS binary packets are not line-terminated)
monitor_speed = 2000000
monitor_filters = esp32_exception_decoder, direct
; Prevent serial monitor from toggling DTR/RTS on connect (avoids ESP32 reset)
monitor_rts = 0
monitor_dtr = 0

; Upload settings — esptool via UART0 (USB-UART bridge)
upload_protocol = esptool
upload_speed = 921600

; Debug build
[env:esp32s3_debug]
extends = env:esp32s3
build_type = debug
build_flags =
    ${env:esp32s3.build_flags}
    -DCORE_DEBUG_LEVEL=5
    -DDEBUG_ENABLED=1

; Production build (minimal debug output, smaller binary)
[env:esp32s3_release]
extends = env:esp32s3
build_flags =
    ${env:esp32s3.build_flags}
    -DDEBUG_ENABLED=0
    -DCORE_DEBUG_LEVEL=0
