; PlatformIO Project Configuration File — HubFX ESP32-S3
;
; Empty entry point — rebuilt from scratch on top of the wave-5
; BoardServer<...Policies> + PacketReader framework.  Subsystems (audio,
; storage, USB host, RC inputs, indicator LEDs) are added back one at a
; time as the new HubFX-specific code lands in
; `controllers/hubfx/esp32s3/src/`.  Reference implementation:
;   controllers/archive/hubfx-esp32s3/

[env:esp32s3]
; pioarduino: Arduino ESP32 v3.x on ESP-IDF v5.5.x (USB Hub driver needs IDF 5.0+).
;
; `framework = arduino` + a non-empty `custom_sdkconfig` AUTOMATICALLY
; triggers pioarduino's Arduino-as-IDF-component build path (see
; HandleArduinoIDFsettings in espidf.py — runs ONLY when arduino is in
; the framework list AND espidf is NOT explicitly added).  Adding
; `espidf` to the framework actually DISABLES this merge logic; we
; want the bare `arduino` + custom_sdkconfig form.  Component-manager
; deps (esp-dsp, esp-adf) get pulled in transitively by Arduino-ESP32's
; manifest under this mode — no idf_component.yml needed on our side.
;
; First build downloads the IDF toolchain + components (~15-30 min
; one-time); subsequent builds are 1-3 min.  Migration tracked in
; feature/idf-component-build.
platform = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
board = esp32-s3-devkitc-1
framework = arduino

; sdkconfig overrides — pioarduino merges these into the auto-generated
; sdkconfig.<env>.  Inline list form (KEY=VALUE per line, indent = part
; of the list).  Rationale lives next to each flag here, not in a
; separate file (the dedicated .overrides file approach wasn't picked
; up by pioarduino's IDF-component path; this inline form works).
;
;   FREERTOS_HZ=1000     Arduino-ESP32 hard-requires it (CMake assert);
;                        also better tick granularity for audio tasks.
;   OPTIMIZATION_PERF    -O3 instead of -Og for the whole build —
;                        matters for the mix kernel and our hot paths.
;                        Side effect: ASSERTIONS_SILENT becomes the
;                        sensible companion (asserts still compiled,
;                        just don't print on hit).
custom_sdkconfig =
    CONFIG_FREERTOS_HZ=1000
    CONFIG_COMPILER_OPTIMIZATION_PERF=y
    # CONFIG_COMPILER_OPTIMIZATION_DEBUG is not set
    CONFIG_COMPILER_OPTIMIZATION_ASSERTIONS_SILENT=y
    # CONFIG_COMPILER_OPTIMIZATION_ASSERTIONS_ENABLE is not set
    ; Arduino-side knobs (were build_flags -D defines under the regular
    ; framework=arduino path; under IDF-component they MUST come through
    ; sdkconfig or trigger a -Werror redefine collision).  Don't touch
    ; CONFIG_ARDUHAL_LOG_DEFAULT_LEVEL_* — pioarduino's default is INFO
    ; and the symbol-wrap (__wrap_log_printf) only links cleanly if we
    ; let those defaults flow through unmodified.
    CONFIG_ARDUINO_RUNNING_CORE=0
    ; KEEP AT 16384 — the HWM-based trim to 12 KB (Phase 7 wave 2,
    ; 2026-05-28) caused firmware reboots during file uploads.  The
    ; HWM measurement was taken at idle; the upload path (StreamWriter
    ; + COBS encode + SD write chain) deep-stacks BEYOND what the
    ; idle peak shows, blowing through the 4 KB margin.  Reverted same
    ; session.  DO NOT trim again without measuring under active upload.
    CONFIG_ARDUINO_LOOP_STACK_SIZE=16384
    ; Boot-time IDF log + panic output on USB Serial-JTAG (separate USB
    ; endpoint, NOT UART0) so it never collides with our COBS protocol.
    # CONFIG_ESP_CONSOLE_UART_DEFAULT is not set
    # CONFIG_ESP_CONSOLE_NONE is not set
    # CONFIG_ESP_CONSOLE_USB_CDC is not set
    CONFIG_ESP_CONSOLE_USB_SERIAL_JTAG=y
    # CONFIG_ESP_CONSOLE_UART_CUSTOM is not set
    # CONFIG_ESP_CONSOLE_SECONDARY_NONE is not set
    CONFIG_ESP_CONSOLE_SECONDARY_USB_SERIAL_JTAG=y

    ; **PSRAM bootloader-time init** — without _BOOT_INIT, the bootloader
    ; doesn't probe + initialize Octal PSRAM, `esp_psram_get_size()`
    ; returns 0 at app start, and every `heap_caps_malloc(MALLOC_CAP_SPIRAM)`
    ; silently returns NULL — which cascades into the "UART driver
    ; malloc error" the full firmware was hitting (PSRAM-resident
    ; service constructors get nullptr, deref, corrupt the heap, next
    ; allocator call fails).  Verified 2026-05-28 with the minimal
    ; bringup sketch: psram_size=0 before this flag was set.
    ;
    ; The pioarduino framework=arduino path bakes _BOOT_INIT into its
    ; pre-built libraries via `board_build.arduino.memory_type`; under
    ; the IDF-component path WE have to set the sdkconfig directly.
    ; Kconfig dependency chain (verified against IDF 5.5.4
    ; esp_psram/Kconfig.spiram.common 2026-05-28):
    ;   SPIRAM → SPIRAM_BOOT_HW_INIT (default y) → SPIRAM_BOOT_INIT (default y)
    ; The pioarduino baseline EXPLICITLY disables _BOOT_HW_INIT
    ; (`# CONFIG_SPIRAM_BOOT_HW_INIT is not set`) which kills the whole
    ; chain.  Force it back on along with its child.
    CONFIG_SPIRAM_BOOT_HW_INIT=y
    CONFIG_SPIRAM_BOOT_INIT=y
    CONFIG_SPIRAM_IGNORE_NOTFOUND=y
    CONFIG_SPIRAM_USE_AHB_DMA=y
    # CONFIG_SPIRAM_TRY_ALLOCATE_WIFI_LWIP is not set
    ; Flash mode + size for the ESP32-S3-WROOM-1 N8R8 — `qio_opi` in
    ; the board manifest sets these for pioarduino's regular path; we
    ; mirror them in sdkconfig here for the IDF-component path.
    CONFIG_ESPTOOLPY_FLASHMODE_QIO=y
    CONFIG_ESPTOOLPY_FLASHSIZE_8MB=y
    CONFIG_ESPTOOLPY_FLASHFREQ_80M=y

    ; **Reclaim internal SRAM** — HubFX uses neither WiFi nor Bluetooth
    ; nor LWIP.  Disabling them saves ~50-80 KB of static internal SRAM
    ; that other allocators need.  pioarduino's bundled framework=arduino
    ; build sets these to OFF; under the IDF-component path WE have to
    ; do it explicitly.  (Kept after the PSRAM root-cause was found —
    ; still the right config for HubFX.)
    # CONFIG_BT_ENABLED is not set
    # CONFIG_ESP_WIFI_ENABLED is not set
    # CONFIG_LWIP_TCP_ENABLED is not set
    # CONFIG_ESP_PHY_ENABLED is not set
    # CONFIG_ESP_COEX_ENABLED is not set

; CPU clock — ESP32-S3 supports 80 / 160 / 240 MHz.
board_build.f_cpu = 240000000L

; USB-OTG is reserved for USB Host mode; UART0 (via the USB-UART bridge)
; is the COBS protocol channel.  cdc_on_boot=1 would steal the OTG controller.
board_build.arduino.cdc_on_boot = 0

; Flash + PSRAM (ESP32-S3-WROOM-1 N8R8: 8 MB QIO flash, 8 MB OPI PSRAM).
board_build.flash_mode             = qio
board_build.flash_size             = 8MB
board_build.f_flash                = 80000000L
board_build.partitions             = partitions.csv
board_build.arduino.memory_type    = qio_opi

; Override the board manifest's `build.extra_flags` list — the default
; for esp32-s3-devkitc-1.json hardcodes ARDUINO_RUNNING_CORE=1 + the
; matching EVENT_RUNNING_CORE.  Those defines are fed to the Arduino-
; ESP32 framework source (NOT just our code), so `build_unflags` can't
; reach them.  Replacing the whole list here keeps the other flags
; (USB_MODE, ESP32S3_DEV) intact while pinning the loop / event task
; to Core 0 — Core 1 belongs to the audio producer + consumer.  See
; instructions/17-SYSTEM-SERVICES.md for the dual-core layout rules.
board_build.extra_flags =
    -DARDUINO_ESP32S3_DEV
    -DARDUINO_USB_MODE=1
    -DARDUINO_RUNNING_CORE=0
    -DARDUINO_EVENT_RUNNING_CORE=0

; Pin to C++20 (concepts + requires-clauses for SystemServicePolicy).
; (RUNNING_CORE / EVENT_RUNNING_CORE handled at board level above —
; board_build.extra_flags reaches both our code AND the framework
; source; build_unflags only reached ours.)
build_unflags = -std=gnu++2b
build_flags =
    -std=gnu++20
    -DSFX_ENABLE_DIAG_LOG=1
    ; Compile the storage stack (FlashModule + SdCardModule low-level
    ; drivers) and the StorageServicePolicy / Esp32StoragePolicy wire
    ; dispatch.  Both gates parked behind per-firmware opt-in.
    -DSFX_HAS_STORAGE=1
    -DSFX_HAS_STORAGE_SERVER=1
    ; Compile the audio stack (mixer + TAS5825M codec + I²S output +
    ; AudioServicePolicy).  Per-firmware opt-in.
    -DSFX_HAS_AUDIO=1
    ; Mixer kernel selector (Phase 5b experiment, 2026-05-28):
    ;   =0  → int16 / Q15 + dsps_mulc_s16_ae32 (production — picked
    ;          after 5-channel A/B; smaller stack scratch, no audible
    ;          quality diff, lower L1 cache pressure)
    ;   =1  → float32   + dsps_*_f32_ae32       (reference path,
    ;          retained for Q15 overflow debugging + future
    ;          comparison)
    ; The 5-channel stress test showed both kernels are decode-bound,
    ; not mix-bound — sd-max ≈ 30 ms per MP3 refill dominates the
    ; producer cycle.  Kernel choice gives ~5 % headroom either way.
    -DSFX_AUDIO_KERNEL_FLOAT=0
    ;
    ; NOTE: Under the IDF-component build path, settings that have a
    ; CONFIG_<X> counterpart MUST live in custom_sdkconfig (above) — not
    ; here as -D defines.  Adding both triggers a -Werror redefine.
    ; Moved 2026-05-28:
    ;   -DCORE_DEBUG_LEVEL=2           → CONFIG_ARDUHAL_LOG_DEFAULT_LEVEL_INFO=y
    ;   -DARDUINO_LOOP_STACK_SIZE=16384 → CONFIG_ARDUINO_LOOP_STACK_SIZE=16384
    ;   -DARDUINO_RUNNING_CORE=0        → CONFIG_ARDUINO_RUNNING_CORE=0
    ;   -DCONFIG_IDF_TARGET_ESP32S3=1   → set by IDF target selection itself

; ── SDK config overrides — ACTIVE ──────────────────────────────────
; sdkconfig.overrides holds the (small) overlay; sdkconfig.defaults is
; auto-generated by pioarduino's IDF-component path (gitignored).
; Phase-based rollout of additional flags (I2S ISR in IRAM, FreeRTOS HZ,
; PSRAM speed) lands in Phase 3+ after the baseline build is green.

; Per-library build-flag tuning (Item 3 from 2026-05-28 audio sweep).
; Appends -Os to libhelix-mp3 so its hot MP3 decode loops fit the
; LX7 I-cache better.  See extra_script.py for the full rationale.
extra_scripts =
    extra_script.py

; Shared ScaleFX libraries
lib_extra_dirs = ../../lib

lib_deps =
    SPI
    SD
    madhephaestus/ESP32Servo@^3.0.5
    ; Helix MP3 decoder — fetched directly from GitHub.  ~9 KB decoder
    ; context per instance; we pool up to AUDIO_MAX_CHANNELS (6)
    ; instances on demand.  Used by Mp3PsramSource to decode MP3 bytes
    ; resident in PSRAM during playback.  No SD I/O at runtime.
    https://github.com/pschatzmann/arduino-libhelix.git
    ; esp-dsp (Item 4 from 2026-05-28 audio sweep) — pulled via ESP-IDF
    ; component manager (NOT lib_deps) in idf_component.yml.  Available
    ; now that framework=arduino,espidf is on (Phase 1 of the IDF
    ; migration, 2026-05-28).  Lands in Phase 4 of the migration once
    ; the baseline build is green and produceFrame is refactored to
    ; block mode.

lib_ignore = SdFat

; UART0 monitor — COBS binary protocol (no line termination).
monitor_speed   = 6000000
monitor_filters = esp32_exception_decoder, direct
monitor_rts     = 0
monitor_dtr     = 0

upload_protocol = esptool
upload_speed    = 921600

[env:esp32s3_debug]
extends      = env:esp32s3
build_type   = debug
build_flags  =
    ${env:esp32s3.build_flags}
    -DCORE_DEBUG_LEVEL=5
    -DDEBUG_ENABLED=1

[env:esp32s3_release]
extends      = env:esp32s3
build_flags  =
    ${env:esp32s3.build_flags}
    -DDEBUG_ENABLED=0
    -DCORE_DEBUG_LEVEL=0
