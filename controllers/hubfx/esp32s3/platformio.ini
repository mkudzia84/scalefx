; PlatformIO Project Configuration File — HubFX ESP32-S3
;
; Empty entry point — rebuilt from scratch on top of the wave-5
; BoardServer<...Policies> + PacketReader framework.  Subsystems (audio,
; storage, USB host, RC inputs, indicator LEDs) are added back one at a
; time as the new HubFX-specific code lands in
; `controllers/hubfx/esp32s3/src/`.  Reference implementation:
;   controllers/archive/hubfx-esp32s3/

[env:esp32s3]
; pioarduino: Arduino ESP32 v3.x on ESP-IDF v5.5.x (USB Hub driver needs IDF 5.0+).
platform = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
board = esp32-s3-devkitc-1
framework = arduino

; CPU clock — ESP32-S3 supports 80 / 160 / 240 MHz.
board_build.f_cpu = 240000000L

; USB-OTG is reserved for USB Host mode; UART0 (via the USB-UART bridge)
; is the COBS protocol channel.  cdc_on_boot=1 would steal the OTG controller.
board_build.arduino.cdc_on_boot = 0

; Flash + PSRAM (ESP32-S3-WROOM-1 N8R8: 8 MB QIO flash, 8 MB OPI PSRAM).
board_build.flash_mode             = qio
board_build.flash_size             = 8MB
board_build.f_flash                = 80000000L
board_build.partitions             = partitions.csv
board_build.arduino.memory_type    = qio_opi

; Pin to C++20 (concepts + requires-clauses for SystemServicePolicy).
build_unflags = -std=gnu++2b
build_flags =
    -std=gnu++20
    -DCORE_DEBUG_LEVEL=2
    ; StreamWriter + COBS buffers push loopTask stack past 8 KB.
    -DARDUINO_LOOP_STACK_SIZE=16384
    ; Run the Arduino loop (setup/loop = LED tick + protocol + ALL I²C:
    ; PCA9685/INA226/codec) on Core 0.  The audio producer + consumer tasks
    ; are pinned to Core 1 at priority 23/24; leaving the loop on Core 1 at
    ; priority 1 starved the LED tick whenever sound played (irregular
    ; pattern).  Core 0 is otherwise idle (no WiFi/BT).  Audio touches no
    ; runtime I²C, so keeping every I²C transaction on this single (Core 0)
    ; loop avoids any cross-core bus contention — no mutex required.
    -DARDUINO_RUNNING_CORE=0
    -DSFX_ENABLE_DIAG_LOG=1
    -DCONFIG_IDF_TARGET_ESP32S3=1
    ; Compile the storage stack (FlashModule + SdCardModule low-level
    ; drivers) and the StorageServicePolicy / Esp32StoragePolicy wire
    ; dispatch.  Both gates parked behind per-firmware opt-in.
    -DSFX_HAS_STORAGE=1
    -DSFX_HAS_STORAGE_SERVER=1
    ; Compile the audio stack (mixer + TAS5825M codec + I²S output +
    ; AudioServicePolicy).  Per-firmware opt-in.
    -DSFX_HAS_AUDIO=1

; Shared ScaleFX libraries
lib_extra_dirs = ../../lib

lib_deps =
    SPI
    SD
    madhephaestus/ESP32Servo@^3.0.5

lib_ignore = SdFat

; UART0 monitor — COBS binary protocol (no line termination).
monitor_speed   = 6000000
monitor_filters = esp32_exception_decoder, direct
monitor_rts     = 0
monitor_dtr     = 0

upload_protocol = esptool
upload_speed    = 921600

[env:esp32s3_debug]
extends      = env:esp32s3
build_type   = debug
build_flags  =
    ${env:esp32s3.build_flags}
    -DCORE_DEBUG_LEVEL=5
    -DDEBUG_ENABLED=1

[env:esp32s3_release]
extends      = env:esp32s3
build_flags  =
    ${env:esp32s3.build_flags}
    -DDEBUG_ENABLED=0
    -DCORE_DEBUG_LEVEL=0
