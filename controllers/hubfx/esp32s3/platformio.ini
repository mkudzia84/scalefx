; PlatformIO Project Configuration File — HubFX ESP32-S3
;
; PURE ESP-IDF build (framework = espidf).  The firmware is Arduino-free:
; native I2C / GPIO+PWM / servo (MCPWM) / UART / wire (sfx::Stream) / timing,
; app_main entry (see src/hubfx_esp32s3.cpp).  Migrated off the previous
; "Arduino-as-IDF-component" (framework = arduino + custom_sdkconfig) path.
;
; sdkconfig:  sdkconfig.defaults carries the full board config (PSRAM OPI +
;             _BOOT_INIT, console=NONE — see note*, 8 MB QIO flash, FreeRTOS
;             HZ=1000, -O3, no BT/WiFi/LWIP).  IDF generates sdkconfig from it.
; components: managed deps (esp-dsp, esp-libhelix-mp3) in src/idf_component.yml;
;             the firmware src component declares its IDF REQUIRES in
;             src/CMakeLists.txt.  Shared library at ../../lib via lib_extra_dirs.

[env:esp32s3]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
board = esp32-s3-devkitc-1
framework = espidf

; Flash + PSRAM (ESP32-S3-WROOM-1 N8R8: 8 MB QIO flash, 8 MB OPI PSRAM).
; The matching CONFIG_* live in sdkconfig.defaults; these drive the uploader.
board_build.flash_mode  = qio
board_build.flash_size  = 8MB
board_build.f_flash     = 80000000L
board_build.partitions  = partitions.csv

build_flags =
    -DSFX_ENABLE_DIAG_LOG=1
    ; Developer-facing diagnostic emission (periodic [mem]/[stack] snapshot,
    ; boot footprint dump, live telemetry, preload-status).  =0 for release.
    -DSFX_INSTRUMENTATION=1
    ; Storage stack (FlashModule + SdCardModule + StorageServicePolicy).
    -DSFX_HAS_STORAGE=1
    -DSFX_HAS_STORAGE_SERVER=1
    ; Audio stack (mixer + TAS5825P codec + I2S out + AudioServicePolicy).
    -DSFX_HAS_AUDIO=1
    ; Mixer kernel: 0 = int16/Q15 + dsps_mulc_s16_ae32 (production).
    -DSFX_AUDIO_KERNEL_FLOAT=0

; The shared ScaleFX library (../../lib) is compiled INTO the firmware
; component — see src/CMakeLists.txt (it carries the IDF REQUIRES the lib needs,
; which a separate lib_extra_dirs component would not).

; UART0 monitor — COBS binary protocol (no line termination).
; * Console is NONE: the ESP32-S3 has ONE internal USB PHY (GPIO19/20) shared by
;   USB-Serial-JTAG and USB-OTG.  The ExpanderService uses USB-OTG HOST to
;   enumerate expander boards, so the USB-Serial-JTAG console MUST be off or it
;   starves the host (no expanders mount).  UART0 is the COBS wire, so the
;   console can't go there either → NONE.  Operational logs ride the DiagLog
;   wire (COBS/UART0); crashes land in the flash coredump (scalefx-flash
;   coredump hubfx).  Proven 2026-06-07 with a console-on-UART USB-host probe
;   (detects the expander) vs console-on-USB-Serial-JTAG (does not).
monitor_speed   = 6000000
monitor_filters = esp32_exception_decoder, direct
monitor_rts     = 0
monitor_dtr     = 0

upload_protocol = esptool
upload_speed    = 921600

[env:esp32s3_debug]
extends      = env:esp32s3
build_type   = debug
build_flags  =
    ${env:esp32s3.build_flags}
    -DDEBUG_ENABLED=1

[env:esp32s3_release]
extends      = env:esp32s3
build_flags  =
    ${env:esp32s3.build_flags}
    -DDEBUG_ENABLED=0
