; PlatformIO Project Configuration File for NoOp ESP32-S3
;
; NoOp - Minimal protocol test stub
; Target: ESP32-S3 (dual Xtensa LX7 cores, 240 MHz)
;
; Implements only the core system commands (INIT, SHUTDOWN, REBOOT,
; KEEPALIVE, STATUS_REQ, I2C_SCAN, IDENTIFY) plus SERVO_SET (0x64)
; for hardware testing.
;
; Useful for:
;   - Testing serial protocol on ESP32-S3 hardware
;   - Verifying COBS/CRC communication at 6Mbps via UART0
;   - Template for new ESP32-S3 controllers
;   - Protocol development and debugging
;
; Build: pio run
; Upload: pio run -t upload
; Serial Monitor: pio device monitor

[env:esp32s3]
; pioarduino platform provides Arduino ESP32 v3.x with ESP-IDF v5.5.x
platform = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
board = esp32-s3-devkitc-1
framework = arduino

; CPU clock — 240 MHz (match HubFX for consistency)
board_build.f_cpu = 240000000L

; Serial debug uses UART0 via USB-UART bridge (no USB-OTG / CDC)
board_build.arduino.cdc_on_boot = 0

; Flash configuration — ESP32-S3-WROOM-1 N8R8: 8MB QIO flash + 8MB OPI PSRAM
board_build.flash_mode = qio
board_build.flash_size = 8MB
board_build.f_flash = 80000000L
board_build.partitions = partitions.csv

; PSRAM configuration — OPI PSRAM on N8R8 module
board_build.arduino.memory_type = qio_opi

; C++17
build_unflags = -std=gnu++2b

build_flags =
    -std=gnu++17
    ; Server mode — excludes USB host client code from sfx_serial
    -DSCALEFX_SERVER=1
    ; Core debug level (0=none, 1=error, 2=warn, 3=info, 4=debug, 5=verbose)
    -DCORE_DEBUG_LEVEL=2
    ; Arduino loopTask stack size (default 8KB; 16KB for safety)
    -DARDUINO_LOOP_STACK_SIZE=16384
    ; Enable DiagLog
    -DSFX_ENABLE_DIAG_LOG=1
    ; ESP32-S3 target flag
    -DCONFIG_IDF_TARGET_ESP32S3=1

; Shared ScaleFX libraries
lib_extra_dirs = ../../lib

; Library dependencies — minimal (no SD, audio, USB, storage)
lib_deps =
    ; Servo control (v3.0.5+ for Arduino ESP32 v3.x LEDC API)
    madhephaestus/ESP32Servo@^3.0.5

; Ignore unused heavy libraries
lib_ignore =
    SdFat
    sfx_usb
    sfx_audio
    sfx_storage
    sfx_config
    esp_cdc_acm

; Serial monitor — UART0 via USB-UART bridge
monitor_speed = 6000000
monitor_filters = esp32_exception_decoder, direct
monitor_rts = 0
monitor_dtr = 0

; Upload via esptool (UART0)
upload_protocol = esptool
upload_speed = 921600
