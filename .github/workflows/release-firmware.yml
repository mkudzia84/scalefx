# Build and release firmware for a specific controller.
# Triggered manually — select the controller and version.
#
# Release tag format:  {controller}-v{version}  (e.g. gunfx-v0.3.0)
# Asset format:        {controller}-firmware-v{version}.zip
# Zip contains a single firmware file: firmware.uf2 (Pico) or firmware.bin (ESP32-S3)

name: Release Firmware

on:
  workflow_dispatch:
    inputs:
      controller:
        description: 'Controller to release'
        required: true
        type: choice
        options:
          - gunfx
          - lightfx
          - gearcontrol
          - hubfx
      version:
        description: 'Version (e.g. 0.3.0) — must match FIRMWARE_VERSION in source'
        required: true
        type: string
      prerelease:
        description: 'Mark as pre-release'
        required: false
        type: boolean
        default: false
      release_notes:
        description: 'Release notes (markdown). Describe what changed — new features, bug fixes, breaking changes.'
        required: true
        type: string

env:
  TAG: "${{ inputs.controller }}-v${{ inputs.version }}"

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install PlatformIO
        run: pip install platformio

      - name: Determine build config
        id: config
        run: |
          case "${{ inputs.controller }}" in
            gunfx)
              echo "subdir=gunfx/pico" >> $GITHUB_OUTPUT
              echo "env=pico" >> $GITHUB_OUTPUT
              echo "ext=uf2" >> $GITHUB_OUTPUT
              echo "platform=Pico (RP2040)" >> $GITHUB_OUTPUT
              ;;
            lightfx)
              echo "subdir=lightfx/pico" >> $GITHUB_OUTPUT
              echo "env=pico" >> $GITHUB_OUTPUT
              echo "ext=uf2" >> $GITHUB_OUTPUT
              echo "platform=Pico (RP2040)" >> $GITHUB_OUTPUT
              ;;
            gearcontrol)
              echo "subdir=gearcontrol/pico" >> $GITHUB_OUTPUT
              echo "env=pico" >> $GITHUB_OUTPUT
              echo "ext=uf2" >> $GITHUB_OUTPUT
              echo "platform=Pico (RP2040)" >> $GITHUB_OUTPUT
              ;;
            hubfx)
              echo "subdir=hubfx/esp32s3" >> $GITHUB_OUTPUT
              echo "env=esp32s3" >> $GITHUB_OUTPUT
              echo "ext=bin" >> $GITHUB_OUTPUT
              echo "platform=ESP32-S3" >> $GITHUB_OUTPUT
              ;;
            *)
              echo "::error::Unknown controller: ${{ inputs.controller }}"
              exit 1
              ;;
          esac

      - name: Verify source version matches
        run: |
          CTRL_DIR="controllers/${{ steps.config.outputs.subdir }}"
          # Find the main firmware source (.ino preferred, then .cpp)
          INO=$(find "$CTRL_DIR/src" -name "*.ino" | head -1)
          if [ -z "$INO" ]; then
            INO=$(find "$CTRL_DIR/src" -name "*.cpp" | head -1)
          fi
          if [ -z "$INO" ]; then
            echo "::error::Cannot find firmware source in $CTRL_DIR/src"
            exit 1
          fi
          # Search for FIRMWARE_VERSION in the found file, or grep across all source files
          SOURCE_VER=$(grep '#define FIRMWARE_VERSION' "$INO" 2>/dev/null | sed 's/.*"\(.*\)".*/\1/')
          if [ -z "$SOURCE_VER" ]; then
            SOURCE_VER=$(grep -r '#define FIRMWARE_VERSION' "$CTRL_DIR/src" | head -1 | sed 's/.*"\(.*\)".*/\1/')
          fi
          if [ -z "$SOURCE_VER" ]; then
            echo "::error::Could not extract FIRMWARE_VERSION from $CTRL_DIR/src"
            exit 1
          fi
          echo "Found FIRMWARE_VERSION=$SOURCE_VER in $INO"
          # Compare on the numeric core only — strip any trailing -suffix so a
          # source "2.33.2-hubfx" matches a release "2.33.2" or "2.33.2-rc1".
          SRC_CORE="${SOURCE_VER%%-*}"
          REQ_CORE="${INPUT_VER%%-*}"
          if [ "$SRC_CORE" != "$REQ_CORE" ]; then
            echo "::error::Source FIRMWARE_VERSION core ($SRC_CORE from $SOURCE_VER) does not match requested version core ($REQ_CORE from $INPUT_VER)"
            exit 1
          fi
          echo "Source version verified: core $SRC_CORE (source $SOURCE_VER, requested $INPUT_VER)"
        env:
          INPUT_VER: ${{ inputs.version }}

      - name: Build firmware
        run: |
          python -m platformio run -e ${{ steps.config.outputs.env }} -d "controllers/${{ steps.config.outputs.subdir }}"

      - name: Package firmware
        run: |
          CTRL_DIR="controllers/${{ steps.config.outputs.subdir }}"
          FW_FILE="$CTRL_DIR/.pio/build/${{ steps.config.outputs.env }}/firmware.${{ steps.config.outputs.ext }}"

          if [ ! -f "$FW_FILE" ]; then
            echo "::error::Firmware file not found: $FW_FILE"
            exit 1
          fi

          ASSET_NAME="${{ inputs.controller }}-firmware-v${{ inputs.version }}.zip"
          # Zip with just the firmware file (no directory structure)
          cd "$(dirname "$FW_FILE")"
          zip "$GITHUB_WORKSPACE/$ASSET_NAME" "firmware.${{ steps.config.outputs.ext }}"

          echo "ASSET_PATH=$GITHUB_WORKSPACE/$ASSET_NAME" >> $GITHUB_ENV
          echo "ASSET_NAME=$ASSET_NAME" >> $GITHUB_ENV

          # Compute SHA256
          SHA=$(sha256sum "$GITHUB_WORKSPACE/$ASSET_NAME" | awk '{print $1}')
          echo "ASSET_SHA256=$SHA" >> $GITHUB_ENV

          FW_SIZE=$(stat -c%s "$GITHUB_WORKSPACE/$FW_FILE" 2>/dev/null || stat -f%z "$GITHUB_WORKSPACE/$FW_FILE")
          echo "FW_SIZE=$FW_SIZE" >> $GITHUB_ENV

      - name: Extract build number
        id: buildnum
        run: |
          CTRL_DIR="controllers/${{ steps.config.outputs.subdir }}"
          BUILD_NUM=$(grep -rh '#define BUILD_NUMBER' "$CTRL_DIR/src" | head -1 | sed 's/.*BUILD_NUMBER[[:space:]]*\([0-9]*\).*/\1/')
          echo "build=${BUILD_NUM:-0}" >> $GITHUB_OUTPUT

      - name: Write release body
        env:
          RELEASE_NOTES: ${{ inputs.release_notes }}
          CONTROLLER: ${{ inputs.controller }}
          VERSION: ${{ inputs.version }}
          PLATFORM: ${{ steps.config.outputs.platform }}
          BUILD: ${{ steps.buildnum.outputs.build }}
          EXT: ${{ steps.config.outputs.ext }}
        run: |
          cat > release-body.md << BODYEOF
          ## ${CONTROLLER} firmware v${VERSION}

          **Platform:** ${PLATFORM}
          **Build:** ${BUILD}
          **Firmware:** \`firmware.${EXT}\`

          ### Release Notes

          ${RELEASE_NOTES}

          ### Asset
          | File | SHA-256 |
          |------|---------|
          | \`${ASSET_NAME}\` | \`${ASSET_SHA256}\` |

          ### Flash via ScaleFX Studio
          Open the **Firmware** tab, select the release, and click **Flash**.
          BODYEOF
          # Trim leading whitespace from heredoc indentation
          sed -i 's/^          //' release-body.md

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          name: "${{ inputs.controller }} v${{ inputs.version }}"
          prerelease: ${{ inputs.prerelease }}
          body_path: release-body.md
          files: ${{ env.ASSET_PATH }}
