# helicopter_landing — Approach/landing configuration (Airbus-style).
#
# Same phase-locked anti-collision pattern as helicopter_flight (single-
# flash beacon + nav group at t=0; double-flash strobe at mid-period,
# non-overlapping; shared 1000 ms period) PLUS the landing light deployed
# and on.
#
# The landing light (pwm 5 + its deploy servo) is a LandingLightService
# entity, so it's driven via `landing_bindings:` below — NOT as a raw
# LightFx channel (LandingLight owns pwm 5).  Activating this program
# flips landing-light ID 0 ON: servo deploys, then the bulb lights.

schema_version: 1

channels:
  # ── Single-flash group (red beacon + position nav lights) ──────────
  - port: { kind: pwm, idx: 0 }                # red rotating beacon — fade pulse
    loop: true
    events:
      - { kind: fade_in,  brightness_pct: 100, duration_ms: 300 }   # ramp 0→100%
      - { kind: fade_out, brightness_pct: 100, duration_ms: 300 }   # ramp 100→0%
      - { kind: "off",    duration_ms: 400 }                        # → 1000 ms period
  - port: { kind: pwm, idx: 2 }                # red nav (port)
    loop: true
    events:
      - { kind: "on",  brightness_pct: 100, duration_ms:  80 }
      - { kind: "off", duration_ms: 920 }
  - port: { kind: pwm, idx: 3 }                # green nav (starboard)
    loop: true
    events:
      - { kind: "on",  brightness_pct: 100, duration_ms:  80 }
      - { kind: "off", duration_ms: 920 }
  - port: { kind: pwm, idx: 4 }                # white nav (tail)
    loop: true
    events:
      - { kind: "on",  brightness_pct: 100, duration_ms:  80 }
      - { kind: "off", duration_ms: 920 }

  # ── Double-flash white anti-collision strobe (offset, non-overlapping) ──
  - port: { kind: pwm, idx: 1 }                # white anti-collision strobe
    loop: true
    events:
      - { kind: "off", duration_ms: 500 }
      - { kind: "on",  brightness_pct: 100, duration_ms:  60 }   # flash 1
      - { kind: "off", duration_ms:  80 }
      - { kind: "on",  brightness_pct: 100, duration_ms:  60 }   # flash 2
      - { kind: "off", duration_ms: 300 }      # → 1000 ms period

  - port: { kind: pwm, idx: 6 }                # cabin light — off
    events:
      - { kind: "off", duration_ms: 0 }
  - port: { kind: pwm, idx: 7 }                # spare — off
    events:
      - { kind: "off", duration_ms: 0 }

# Nose searchlight goes hot — servo deploys, bulb (pwm 5) lights — via
# the LandingLightService, which owns that port.
landing_bindings:
  - { id: 0, state: "on" }
