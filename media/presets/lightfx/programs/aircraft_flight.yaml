# Aircraft — Flight (fixed-wing, airborne)
#
# FAA-realistic in-flight exterior lighting for a fixed-wing scale model:
#   • Position/nav lights + tail are STEADY (14 CFR 91.209): red port +
#     green starboard on "Position lights", white aft on "White tail".
#   • Red anti-collision beacon flashes + white anti-collision strobe
#     double-flashes, ~50 cycles/min — inside the FAA 40–100 fpm window
#     (14 CFR 23.1401).  Strobe offset to mid-period (never coincides
#     with the beacon).
#
# Looping tracks share a 1200 ms period for phase-lock; steady tracks
# use a single terminal `on`.  v2 schema — channel names match the
# LedAnimator port labels on the IO tab.

schema_version: 2

tracks:
  # ── Red anti-collision beacon — flash, ~50/min ──
  - channel: "Red beacon"
    loop: true
    events:
      - { kind: fade_in,  brightness_pct: 100, duration_ms: 200 }
      - { kind: fade_out, brightness_pct: 100, duration_ms: 200 }
      - { kind: "off",                          duration_ms: 800 }

  # ── Position / nav lights — STEADY ──
  - channel: "Position lights"
    events:
      - { kind: "on", brightness_pct: 100, duration_ms: 0 }

  # ── White tail (aft position light) — STEADY ──
  - channel: "White tail"
    events:
      - { kind: "on", brightness_pct: 100, duration_ms: 0 }

  # ── White anti-collision strobe — double-flash, ~50/min, offset ──
  - channel: "White strobe"
    loop: true
    events:
      - { kind: "off",                       duration_ms: 600 }
      - { kind: "on",  brightness_pct: 100, duration_ms:  40 }
      - { kind: "off",                       duration_ms:  80 }
      - { kind: "on",  brightness_pct: 100, duration_ms:  40 }
      - { kind: "off",                       duration_ms: 440 }

landing_bindings: []
