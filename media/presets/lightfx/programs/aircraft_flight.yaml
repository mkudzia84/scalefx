# Aircraft — Flight (fixed-wing, airborne)
#
# FAA-realistic in-flight exterior lighting for a fixed-wing scale model:
#   • Position/nav lights + tail are STEADY (14 CFR 91.209): red port +
#     green starboard on "Position lights", white aft on "White tail".
#   • Red anti-collision beacon flashes at ~50/min (1200 ms) + white
#     anti-collision strobe double-flashes at ~60/min (1000 ms) — both
#     inside the FAA 40–100 fpm window (14 CFR 23.1401, EASA CS-23,
#     MIL-STD-3009).  Distinct rates, like real independent beacon/strobe
#     systems, so they drift through each other instead of locking.
#
# Each looping track repeats on its OWN period; steady tracks use a single
# terminal `on`.  v2 schema — channel names match the LedAnimator port
# labels on the IO tab.

schema_version: 2

tracks:
  # ── Red anti-collision beacon — flash, ~50/min ──
  - channel: "Red beacon"
    loop: true
    events:
      - { kind: fade_in,  brightness_pct: 100, duration_ms: 200 }
      - { kind: fade_out, brightness_pct: 100, duration_ms: 200 }
      - { kind: "off",                          duration_ms: 800 }

  # ── Position / nav lights — STEADY ──
  - channel: "Position lights"
    events:
      - { kind: "on", brightness_pct: 100, duration_ms: 0 }

  # ── White tail (aft position light) — STEADY ──
  - channel: "White tail"
    events:
      - { kind: "on", brightness_pct: 100, duration_ms: 0 }

  # ── White anti-collision strobe — double-flash, ~60/min ──
  - channel: "White strobe"
    loop: true
    events:
      - { kind: "on",  brightness_pct: 100, duration_ms:  40 }
      - { kind: "off",                       duration_ms:  80 }
      - { kind: "on",  brightness_pct: 100, duration_ms:  40 }
      - { kind: "off",                       duration_ms: 840 }   # → 1000 ms / 60 fpm

landing_bindings: []
