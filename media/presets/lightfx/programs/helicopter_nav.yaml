# helicopter_nav — Position lights only.
#
# FAA Part 91.209(a): position lights required from sunset to sunrise.
# Use this program for static display / cold-and-dark + battery on, or
# for daytime parking with nav lights on for visibility.  No
# anti-collision activity — switch to `helicopter_flight` once rotors
# are about to spin.
#
# Position lights are steady (continuous on), per 14 CFR § 23.1389 and
# FAR 91.209.

schema_version: 1

channels:
  - port: { kind: pwm, idx: 0 }                # beacon — off
    events:
      - kind: off
        duration_ms: 0
  - port: { kind: pwm, idx: 1 }                # white strobe — off
    events:
      - kind: off
        duration_ms: 0
  - port: { kind: pwm, idx: 2 }                # red nav (port)
    brightness_pct: 100
    events:
      - kind: on
        brightness_pct: 100
  - port: { kind: pwm, idx: 3 }                # green nav (starboard)
    brightness_pct: 100
    events:
      - kind: on
        brightness_pct: 100
  - port: { kind: pwm, idx: 4 }                # white nav (tail)
    brightness_pct: 100
    events:
      - kind: on
        brightness_pct: 100
  - port: { kind: pwm, idx: 5 }                # landing light — off
    events:
      - kind: off
        duration_ms: 0
  - port: { kind: pwm, idx: 6 }                # cabin light — off
    events:
      - kind: off
        duration_ms: 0
  - port: { kind: pwm, idx: 7 }                # spare — off
    events:
      - kind: off
        duration_ms: 0
