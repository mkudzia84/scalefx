# helicopter_flight — Full FAA-compliant flight lighting (Airbus-style).
#
# Anti-collision pattern, all phase-locked to a shared 1000 ms period
# (LedAnimator drives looping tracks off `now % period`, so every
# track stays in lockstep):
#
#   t=0..80ms    : SINGLE flash — red beacon + position lights + tail
#                  pulse together (one short bright flash per second).
#   t=500..560 + 640..700ms : DOUBLE flash — white anti-collision strobe
#                  (two quick pulses), offset to mid-period so it NEVER
#                  overlaps the single-flash group.
#
# `loop: true` on a track makes its events a repeating, phase-locked
# pattern (period = sum of duration_ms).  Tracks that share the period
# blink in perfect sync; offsets are just leading `off` segments.
#
# v2 schema — channel names match /hubfx.yaml port labels.  See
# helicopter_off.yaml for the standard channel list.  Landing light
# stays off in cruise — switch to `helicopter_landing` to deploy + light.

schema_version: 2

tracks:
  # ── Single-flash group: red beacon (fade pulse) + position lights + tail ──
  - channel: "Red beacon"
    loop: true
    events:
      - { kind: fade_in,  brightness_pct: 100, duration_ms: 300 }
      - { kind: fade_out, brightness_pct: 100, duration_ms: 300 }
      - { kind: "off",                          duration_ms: 400 }   # → 1000 ms period

  - channel: "Position lights"
    loop: true
    events:
      - { kind: "on",  brightness_pct: 100, duration_ms:  80 }
      - { kind: "off",                       duration_ms: 920 }

  - channel: "White tail"
    loop: true
    events:
      - { kind: "on",  brightness_pct: 100, duration_ms:  80 }
      - { kind: "off",                       duration_ms: 920 }

  # ── Double-flash white anti-collision strobe (offset; non-overlap) ──
  - channel: "White strobe"
    loop: true
    events:
      - { kind: "off",                       duration_ms: 500 }   # wait
      - { kind: "on",  brightness_pct: 100, duration_ms:  60 }   # flash 1
      - { kind: "off",                       duration_ms:  80 }
      - { kind: "on",  brightness_pct: 100, duration_ms:  60 }   # flash 2
      - { kind: "off",                       duration_ms: 300 }   # → 1000 ms period

  - channel: "Landing light"
    events:
      - { kind: "off", duration_ms: 0 }
