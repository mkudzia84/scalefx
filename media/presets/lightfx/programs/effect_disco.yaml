# effect_disco — Chase pattern: each channel pulses 200 ms, offset
# from its neighbour so a "running light" walks across the channels.
#
# Period = N × 200 ms where N is the channel count.  This file
# defines 4 tracks; add/remove tracks in Studio and adjust the leading
# `off` duration so each one's pulse is offset by 200 ms × idx and
# total cycle stays consistent.
#
# v2 schema — label four LedAnimator ports on the IO tab as Chase 1..4
# (or whatever names you prefer; the dropdown will list them).  This
# preset references them as `Chase 1` etc. — re-bind to your labels
# in Studio after picking.

schema_version: 2

tracks:
  - channel: "Chase 1"
    brightness_pct: 100
    loop: true
    events:
      - { kind: "on",  brightness_pct: 100, duration_ms: 200 }
      - { kind: "off",                       duration_ms: 600 }    # → 800 ms period

  - channel: "Chase 2"
    brightness_pct: 100
    loop: true
    events:
      - { kind: "off",                       duration_ms: 200 }
      - { kind: "on",  brightness_pct: 100, duration_ms: 200 }
      - { kind: "off",                       duration_ms: 400 }

  - channel: "Chase 3"
    brightness_pct: 100
    loop: true
    events:
      - { kind: "off",                       duration_ms: 400 }
      - { kind: "on",  brightness_pct: 100, duration_ms: 200 }
      - { kind: "off",                       duration_ms: 200 }

  - channel: "Chase 4"
    brightness_pct: 100
    loop: true
    events:
      - { kind: "off",                       duration_ms: 600 }
      - { kind: "on",  brightness_pct: 100, duration_ms: 200 }

landing_bindings: []
